name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  research-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile analysis scripts
        run: python -m compileall -q analysis
      - name: Check bibliography coverage
        run: python analysis/check_literature_coverage.py
      - name: Run analytical thermal model
        run: python analysis/thermal_bias.py --no-figure
